version: '3.8'

services:
  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finrag-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - VECTOR_DB_HOST=weaviate
      - GRAPH_DB_HOST=neo4j
      - REDIS_HOST=redis
      - POSTGRES_HOST=postgres
    depends_on:
      - weaviate
      - neo4j
      - redis
      - postgres
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./models:/app/models
    networks:
      - finrag-network
    restart: unless-stopped

  # Document Processor Service
  document-processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    container_name: finrag-processor
    environment:
      - PYTHONUNBUFFERED=1
      - KAFKA_BROKER=kafka:9092
      - OCR_ENGINE=tesseract
      - TABLE_EXTRACTOR=camelot
    depends_on:
      - kafka
      - weaviate
    volumes:
      - ./data:/app/data
    networks:
      - finrag-network
    restart: unless-stopped

  # Weaviate Vector Database
  weaviate:
    image: semitechnologies/weaviate:1.22.4
    container_name: finrag-weaviate
    ports:
      - "8080:8080"
    environment:
      - QUERY_DEFAULTS_LIMIT=25
      - AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED=false
      - AUTHENTICATION_APIKEY_ENABLED=true
      - AUTHENTICATION_APIKEY_ALLOWED_KEYS=finrag-api-key
      - PERSISTENCE_DATA_PATH=/var/lib/weaviate
      - ENABLE_MODULES=text2vec-transformers
      - DEFAULT_VECTORIZER_MODULE=text2vec-transformers
      - TRANSFORMERS_INFERENCE_API=http://t2v-transformers:8080
    volumes:
      - weaviate_data:/var/lib/weaviate
    networks:
      - finrag-network
    restart: unless-stopped

  # Text2Vec Transformers Module
  t2v-transformers:
    image: semitechnologies/transformers-inference:sentence-transformers-all-MiniLM-L6-v2
    container_name: finrag-transformers
    environment:
      - ENABLE_CUDA=0
    networks:
      - finrag-network

  # Neo4j Graph Database
  neo4j:
    image: neo4j:5.14-community
    container_name: finrag-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/finrag_password
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4JLABS_PLUGINS=["apoc", "graph-data-science"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - finrag-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: finrag-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass finrag_redis_pass
    volumes:
      - redis_data:/data
    networks:
      - finrag-network
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: finrag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=finrag
      - POSTGRES_PASSWORD=finrag_postgres_pass
      - POSTGRES_DB=finrag_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finrag-network
    restart: unless-stopped

  # Kafka Message Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: finrag-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
    depends_on:
      - zookeeper
    networks:
      - finrag-network
    restart: unless-stopped

  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: finrag-zookeeper
    ports:
      - "2181:2181"
    environment:
      - ZOOKEEPER_CLIENT_PORT=2181
      - ZOOKEEPER_TICK_TIME=2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - finrag-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: finrag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - finrag-network
    restart: unless-stopped

  # Grafana Dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: finrag-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=finrag_grafana_pass
      - GF_INSTALL_PLUGINS=grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - finrag-network
    restart: unless-stopped

networks:
  finrag-network:
    driver: bridge

volumes:
  weaviate_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  postgres_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:
