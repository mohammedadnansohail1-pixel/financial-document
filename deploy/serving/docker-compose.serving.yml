# Docker Compose for Model Serving Testing
# Run model serving locally for testing

version: '3.8'

services:
  # Model Serving Server
  model-serving:
    build:
      context: ../..
      dockerfile: deploy/serving/Dockerfile.serving
    container_name: finrag-model-serving
    ports:
      - "8002:8002"
    environment:
      - MAX_CACHED_MODELS=3
      - MAX_MEMORY_MB=4000
      - DEVICE=cpu
      - LOG_LEVEL=INFO
    volumes:
      - model-cache:/app/.cache
      - serving-logs:/app/logs
    networks:
      - serving-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Model Serving (Replica 2)
  model-serving-2:
    build:
      context: ../..
      dockerfile: deploy/serving/Dockerfile.serving
    container_name: finrag-model-serving-2
    ports:
      - "8003:8002"
    environment:
      - MAX_CACHED_MODELS=3
      - MAX_MEMORY_MB=4000
      - DEVICE=cpu
      - LOG_LEVEL=INFO
    volumes:
      - model-cache-2:/app/.cache
      - serving-logs-2:/app/logs
    networks:
      - serving-network
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Load Balancer (nginx)
  load-balancer:
    image: nginx:alpine
    container_name: finrag-lb
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - model-serving
      - model-serving-2
    networks:
      - serving-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis for caching results
  redis-serving:
    image: redis:7-alpine
    container_name: finrag-redis-serving
    ports:
      - "6381:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - serving-network
    volumes:
      - redis-serving-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Prometheus for monitoring
  prometheus-serving:
    image: prom/prometheus:latest
    container_name: finrag-prometheus-serving
    ports:
      - "9092:9090"
    volumes:
      - ./prometheus-serving.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-serving-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
    networks:
      - serving-network

  # Grafana for visualization
  grafana-serving:
    image: grafana/grafana:latest
    container_name: finrag-grafana-serving
    ports:
      - "3002:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=serving_admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-serving-data:/var/lib/grafana
    depends_on:
      - prometheus-serving
    networks:
      - serving-network

networks:
  serving-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  model-cache:
    driver: local
  model-cache-2:
    driver: local
  serving-logs:
    driver: local
  serving-logs-2:
    driver: local
  redis-serving-data:
    driver: local
  prometheus-serving-data:
    driver: local
  grafana-serving-data:
    driver: local
