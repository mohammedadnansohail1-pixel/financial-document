---
# Horizontal Pod Autoscaler for US East
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: edge-us-east-hpa
  namespace: finrag-edge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: edge-us-east
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# Horizontal Pod Autoscaler for EU West
