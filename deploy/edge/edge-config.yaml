---
# Service for US East edge nodes
apiVersion: v1
kind: Service
metadata:
  name: edge-us-east
  namespace: finrag-edge
  labels:
    app: finrag-edge
    region: us-east
spec:
  type: ClusterIP
  selector:
    app: finrag-edge
    region: us-east
  ports:
    - name: http
      port: 8001
      targetPort: 8001
      protocol: TCP
  sessionAffinity: ClientIP

---
