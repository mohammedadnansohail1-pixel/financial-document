---
# Network Policy for edge nodes
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge-network-policy
  namespace: finrag-edge
spec:
  podSelector:
    matchLabels:
      app: finrag-edge
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from central cluster
    - from:
        - namespaceSelector:
            matchLabels:
              name: finrag
        - podSelector:
            matchLabels:
              app: finrag-api
      ports:
        - protocol: TCP
          port: 8001
    # Allow traffic from same namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: finrag-edge
      ports:
        - protocol: TCP
          port: 8001
  egress:
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow connection to central cluster
    - to:
        - namespaceSelector:
            matchLabels:
              name: finrag
      ports:
        - protocol: TCP
          port: 8000
    # Allow external APIs (for data fetching)
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

---
# ServiceMonitor for Prometheus (if using Prometheus Operator)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: edge-metrics
  namespace: finrag-edge
  labels:
    app: finrag-edge
spec:
  selector:
    matchLabels:
      app: finrag-edge
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s

---
# PodDisruptionBudget for edge nodes
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: edge-pdb
  namespace: finrag-edge
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: finrag-edge
