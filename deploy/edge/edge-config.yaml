# Kubernetes Configuration for Edge Deployment
# Lightweight edge nodes for distributed processing

---
# Namespace for edge nodes
apiVersion: v1
kind: Namespace
metadata:
  name: finrag-edge
  labels:
    name: finrag-edge
    environment: production

---
# ConfigMap for edge configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-config
  namespace: finrag-edge
data:
  CENTRAL_ENDPOINT: "http://finrag-api.finrag.svc.cluster.local:8000"
  CACHE_SIZE_MB: "500"
  LOG_LEVEL: "INFO"
  SYNC_INTERVAL_SECONDS: "300"
  HEALTH_CHECK_INTERVAL_SECONDS: "60"

---
# Secret for edge authentication (example)
apiVersion: v1
kind: Secret
metadata:
  name: edge-secrets
  namespace: finrag-edge
type: Opaque
stringData:
  API_KEY: "edge-api-key-placeholder"
  JWT_SECRET: "edge-jwt-secret-placeholder"

---
# Edge Node Deployment - US East
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-us-east
  namespace: finrag-edge
  labels:
    app: finrag-edge
    region: us-east
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finrag-edge
      region: us-east
  template:
    metadata:
      labels:
        app: finrag-edge
        region: us-east
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: edge-server
          image: finrag/edge:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
              protocol: TCP
          env:
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REGION
              value: "us-east"
            - name: CENTRAL_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: edge-config
                  key: CENTRAL_ENDPOINT
            - name: CACHE_SIZE_MB
              valueFrom:
                configMapKeyRef:
                  name: edge-config
                  key: CACHE_SIZE_MB
            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: edge-config
                  key: LOG_LEVEL
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: edge-secrets
                  key: API_KEY
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: cache
              mountPath: /app/cache
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 1Gi
        - name: logs
          emptyDir:
            sizeLimit: 500Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - finrag-edge
                topologyKey: kubernetes.io/hostname

